# /etc/nginx/sites-available/stockflow.conf  ->  sites-enabled/
#
#   certbot --nginx -d stockflow.example.com     # fills in the TLS block
#   nginx -t && systemctl reload nginx
#
# Replace stockflow.example.com throughout, and set APP_URL to the same origin
# in /etc/stockflow/stockflow.env — Better Auth checks the Origin header and
# will reject its own sign-in requests if the two disagree.

server {
    listen 80;
    listen [::]:80;
    server_name stockflow.example.com;

    # certbot rewrites this to a 301 once a certificate exists.
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;

        # Better Auth's CSRF check reads Origin, and the app builds absolute
        # URLs from Host. Both have to survive the hop.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # Hashed filenames, so they can be cached hard. Everything else is the app.
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Media never reaches this server — the browser posts it straight to
    # Google — so the default 1 MiB body limit is deliberately left alone.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
